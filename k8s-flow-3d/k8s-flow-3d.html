<!DOCTYPE html>
<!-- Shared direct-open visualizer shell. Page metadata comes from the deck;
     scenario content and selector options come from the stable-id registry. -->
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title></title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../flow3d/flow3d.css"/>
</head>
<body>
<main id="layout">
  <div id="main">
    <div id="progress-bar"></div>
    <div id="scene-wrap">
      <!-- aria-label comes from the manifest: it names the subject being
           simulated, so only the deck can write it. -->
      <canvas id="canvas" role="img"></canvas>
      <div id="labels"></div>
      <div id="fade-overlay"></div>
      <div id="dir-flash"></div>
      <div id="step-intro" class="step-intro" aria-hidden="true">
        <h2 id="intro-title"></h2><p id="intro-desc"></p>
        <button id="intro-skip" type="button">Next →</button>
      </div>
      <!-- Metric HUD — rows rendered from step.scores (scores or capacities) -->
      <div id="score-hud" aria-live="polite" aria-label="Scenario metrics"></div>
    </div>
    <!-- Pipeline strip — stages rendered from scenario.pipeline -->
    <div id="pipeline-ui" aria-label="Scenario pipeline"></div>
  </div>
  <aside id="flow-panel" aria-label="Điều khiển kịch bản">
    <label id="scenario-select-label" for="scenario-select">Kịch bản</label>
    <select id="scenario-select" name="scenario" autocomplete="off" aria-describedby="scenario-status"></select>
    <div class="panel-heading">
      <div><div id="panel-scenario-name">—</div><div id="panel-scenario-tag">—</div></div>
      <button id="explain-toggle" type="button" aria-expanded="false" aria-controls="explain-body">Chi tiết</button>
    </div>
    <div id="panel-position">Step 1/1</div>
    <div id="panel-parent"></div>
    <h1 id="panel-title">—</h1>
    <div id="explain-body" hidden>
      <div class="explain-slot visible" id="slot-a"><div class="e-desc" id="e-desc">—</div></div>
      <div class="explain-slot hidden" id="slot-b"><div class="e-desc" id="e-desc-b">—</div></div>
    </div>
    <div id="nav-progress" aria-hidden="true"></div>
    <div id="explain-nav">
      <button class="btn" id="btn-prev" type="button">← Prev</button>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <button class="btn primary" id="btn-next" type="button">Next →</button>
    </div>
    <div id="scenario-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  </aside>
</main>
<div id="popup"></div>

<!-- Three.js UMD build -->
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
<!-- Post-processing (bloom). Tuỳ chọn: nếu CDN không tới được, engine tự khoá
     chất lượng ở mức THẤP và render thẳng. Thứ tự bắt buộc — ShaderPass và
     UnrealBloomPass kế thừa THREE.Pass do EffectComposer.js định nghĩa. -->
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<!-- ════ REUSABLE · SCENE KIT ════════════════════════════════════════════
     The authoring vocabulary every deck is written with — tokens, world
     builder, state marks, panel/HUD helpers, and the shell chrome renderer.
     Nothing here knows about any subject. Identical in every deck. -->
<script src="../flow3d/flow3d-kit-design-tokens.js"></script>
<script src="../flow3d/flow3d-kit-shape-library.js"></script>
<script src="../flow3d/flow3d-kit-world-builder.js"></script>
<script src="../flow3d/flow3d-kit-state-marks.js"></script>
<script src="../flow3d/flow3d-kit-panel-and-hud.js"></script>
<script src="../flow3d/flow3d-engine-scenario-registry.js"></script>
<script src="../flow3d/flow3d-deck.js"></script>

<script src="k8s-flow-3d-scenario-scheduler-pipeline-node.js"></script>
<script src="k8s-flow-3d-scenario-scheduler-pipeline.js"></script>
<script src="k8s-flow-3d-scenario-preemption-model.js"></script>
<script src="k8s-flow-3d-scenario-preemption-world.js"></script>
<script src="k8s-flow-3d-scenario-preemption-filter.js"></script>
<script src="k8s-flow-3d-scenario-preemption-evict.js"></script>
<script src="k8s-flow-3d-scenario-preemption.js"></script>
<script src="k8s-flow-3d-scenario-kubelet-eviction-model.js"></script>
<script src="k8s-flow-3d-scenario-kubelet-eviction-policy.js"></script>
<script src="k8s-flow-3d-scenario-kubelet-eviction-world.js"></script>
<script src="k8s-flow-3d-scenario-kubelet-eviction-pressure.js"></script>
<script src="k8s-flow-3d-scenario-kubelet-eviction-ranking.js"></script>
<script src="k8s-flow-3d-scenario-kubelet-eviction-consequence.js"></script>
<script src="k8s-flow-3d-scenario-kubelet-eviction.js"></script>
<script src="k8s-flow-3d-scenario-oom-killer-model.js"></script>
<script src="k8s-flow-3d-scenario-oom-killer-world.js"></script>
<script src="k8s-flow-3d-scenario-oom-shared-step-helpers.js"></script>
<script src="k8s-flow-3d-scenario-oom-killer-steps.js"></script>
<script src="k8s-flow-3d-scenario-oom-killer.js"></script>
<script src="k8s-flow-3d-scenario-node-wide-oom-world.js"></script>

<script src="k8s-flow-3d-scenario-manual-scale.js"></script>

     Flattens step.phases[] into steps, then renders and drives them. Must

<script src="../flow3d/flow3d-engine-phase-expander.js"></script>
<script src="../flow3d/flow3d-engine-scene-setup.js"></script>

<script src="../flow3d/flow3d-engine-flow-state.js"></script>

</body>
