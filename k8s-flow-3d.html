<!DOCTYPE html>
<!-- lang, <title>, and every piece of copy below are filled in at load time
     from the deck manifest (see flow3d-deck.js). This file is the structural
     shell only — building a deck about another subject means swapping the
     DECK script band near the bottom, not editing markup up here. -->
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title></title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="flow3d.css"/>
</head>
<body>

<!-- ─── INTRO SPLASH ─── copy from the manifest; chips from SCENARIOS[].name -->
<div id="intro-splash">
  <div class="intro-eyebrow" id="intro-eyebrow"></div>
  <div class="intro-title" id="intro-title"></div>
  <div class="intro-sub" id="intro-sub"></div>
  <div class="intro-btn-wrap" id="intro-btn-wrap">
    <button class="intro-btn" id="intro-start-btn"></button>
  </div>
  <div class="intro-scenarios" id="intro-scenarios"></div>
</div>

<div id="topbar">
  <span class="brand" id="brand"></span>
  <div class="sep"></div>
  <div id="breadcrumb"><em id="bc-sc">—</em><span>›</span><em id="bc-st">—</em></div>
  <span id="kb">← → keys</span>
</div>
<div id="layout">
  <div id="sidebar">
    <div id="sidebar-hd"></div>
    <div id="sc-list"></div>
  </div>
  <div id="main">
    <div id="progress-bar"></div>
    <div id="scene-wrap">
      <!-- aria-label comes from the manifest: it names the subject being
           simulated, so only the deck can write it. -->
      <canvas id="canvas" role="img"></canvas>
      <div id="labels"></div>
      <div id="fade-overlay"></div>
      <div id="dir-flash"></div>
      <!-- Step title: appears centered, then lifts to the top and stays pinned there for the step -->
      <div id="step-announce">
        <div class="sa-num" id="sa-num"></div>
        <div class="sa-title" id="sa-title"></div>
      </div>
      <!-- Phase title: anchored near the visualizer bottom, fades in and back out for each phase -->
      <div id="phase-announce">
        <div class="pa-num" id="pa-num"></div>
        <div class="pa-title" id="pa-title"></div>
      </div>
      <!-- Metric HUD — rows rendered from step.scores (scores or capacities) -->
      <div id="score-hud" aria-live="polite" aria-label="Scenario metrics"></div>
    </div>
    <!-- Pipeline strip — stages rendered from scenario.pipeline -->
    <div id="pipeline-ui" aria-label="Scenario pipeline"></div>
    <div id="explain">
      <div id="step-num-wrap">
        <div id="step-num">01</div>
        <div id="step-phase"></div>
      </div>
      <div id="explain-body" aria-live="polite">
        <div class="explain-slot visible" id="slot-a">
          <div class="e-label" id="e-label">STEP 1 OF 1</div>
          <div class="e-parent" id="e-parent"></div>
          <div class="e-title" id="e-title">—</div>
          <div class="e-desc" id="e-desc">—</div>
        </div>
        <div class="explain-slot hidden" id="slot-b">
          <div class="e-label" id="e-label-b"></div>
          <div class="e-parent" id="e-parent-b"></div>
          <div class="e-title" id="e-title-b"></div>
          <div class="e-desc" id="e-desc-b"></div>
        </div>
      </div>
      <div id="explain-nav">
        <div class="nav-row">
          <button class="btn" id="btn-prev">← Prev</button>
          <button class="btn primary" id="btn-next">Next →</button>
        </div>
        <div class="dots" id="dots"></div>
      </div>
    </div>
  </div>
</div>
<div id="popup"></div>

<!-- Three.js UMD build -->
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>

<!-- ════ REUSABLE · SCENE KIT ════════════════════════════════════════════
     The authoring vocabulary every deck is written with — tokens, world
     builder, state marks, panel/HUD helpers, and the shell chrome renderer.
     Nothing here knows about any subject. Identical in every deck. -->
<script src="flow3d-kit-design-tokens.js"></script>
<script src="flow3d-kit-world-builder.js"></script>
<script src="flow3d-kit-state-marks.js"></script>
<script src="flow3d-kit-panel-and-hud.js"></script>
<script src="flow3d-deck.js"></script>

<!-- ════ DECK · KUBERNETES ═══════════════════════════════════════════════
     THE ONLY BAND THAT CHANGES PER DECK. Manifest first (it defines the
     chrome), then the scenario worlds and steps. -->
<script src="k8s-flow-3d-deck.js"></script>
<script src="k8s-flow-3d-scenarios-index.js"></script>
<script src="k8s-flow-3d-scenario-scheduler-model.js"></script>
<script src="k8s-flow-3d-scenario-scheduler-world.js"></script>
<script src="k8s-flow-3d-scenario-scheduler-pipeline-control-plane.js"></script>
<script src="k8s-flow-3d-scenario-scheduler-pipeline-node.js"></script>
<script src="k8s-flow-3d-scenario-scheduler-pipeline.js"></script>
<script src="k8s-flow-3d-scenario-preemption-model.js"></script>
<script src="k8s-flow-3d-scenario-preemption-world.js"></script>
<script src="k8s-flow-3d-scenario-preemption-filter.js"></script>
<script src="k8s-flow-3d-scenario-preemption-evict.js"></script>
<script src="k8s-flow-3d-scenario-preemption.js"></script>
<script src="k8s-flow-3d-scenario-kubelet-eviction-model.js"></script>
<script src="k8s-flow-3d-scenario-kubelet-eviction-policy.js"></script>
<script src="k8s-flow-3d-scenario-kubelet-eviction-world.js"></script>
<script src="k8s-flow-3d-scenario-kubelet-eviction-pressure.js"></script>
<script src="k8s-flow-3d-scenario-kubelet-eviction-ranking.js"></script>
<script src="k8s-flow-3d-scenario-kubelet-eviction-consequence.js"></script>
<script src="k8s-flow-3d-scenario-kubelet-eviction.js"></script>
<script src="k8s-flow-3d-scenario-oom-killer-model.js"></script>
<script src="k8s-flow-3d-scenario-oom-killer-world.js"></script>
<script src="k8s-flow-3d-scenario-oom-killer-steps.js"></script>
<script src="k8s-flow-3d-scenario-oom-killer.js"></script>
<script src="k8s-flow-3d-scenario-pdb-drain-model.js"></script>
<script src="k8s-flow-3d-scenario-pdb-drain-world.js"></script>
<script src="k8s-flow-3d-scenario-pdb-drain-steps.js"></script>
<script src="k8s-flow-3d-scenario-pdb-drain.js"></script>

<!-- ════ REUSABLE · ENGINE ═══════════════════════════════════════════════
     Flattens step.phases[] into steps, then renders and drives them. Must
     run after every scenario has registered itself. Identical in every deck. -->
<script src="flow3d-engine-phase-expander.js"></script>
<script src="flow3d-engine-scene-setup.js"></script>
<script src="flow3d-engine-animation-helpers.js"></script>
<script src="flow3d-engine-flow-state.js"></script>
<script src="flow3d-engine-build-api.js"></script>
<script src="flow3d-engine-persistent-world.js"></script>
<script src="flow3d-engine-component-anchors.js"></script>
<script src="flow3d-engine-hud-controller.js"></script>
<script src="flow3d-engine-ui-controller.js"></script>
<script src="flow3d-engine-render-loop.js"></script>
</body>
</html>
