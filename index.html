<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tranngoclai.github.io</title>
  <meta name="description" content="Điều hướng tới các dự án trên trang." />
  <style>
    :root {
      --bg: #0b0e11;
      --panel: #12161b;
      --line: rgba(255,255,255,.08);
      --ink: #f2f4f6;
      --muted: #9aa4ad;
      --cyan: #62e7f5;
      --acid: #c8ff3d;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f6f7f8; --panel: #ffffff; --line: rgba(0,0,0,.08); --ink: #14181c; --muted: #55606a; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px 20px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 900;
      letter-spacing: -.03em;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 760px;
    }
    .card {
      display: block;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      color: var(--ink);
      text-decoration: none;
      transition: border-color .2s ease, transform .2s ease;
    }
    .card:hover, .card:focus-visible { border-color: var(--cyan); transform: translateY(-2px); }
    .card-tag {
      display: inline-block;
      margin-bottom: 10px;
      padding: 3px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--acid) 15%, transparent);
      color: var(--acid);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .card h2 { margin: 0 0 8px; font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; }
    .card p { margin: 0; color: var(--muted); font-size: .92rem; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>tranngoclai.github.io</h1>
  <nav class="grid" aria-label="Danh sách dự án">
    <a class="card" href="video-generation/index.html">
      <span class="card-tag">Curriculum</span>
      <h2>Video Gen Lab</h2>
      <p>Chương trình học về diffusion model và kiến trúc tạo sinh video.</p>
    </a>
    <a class="card" href="k8s-flow-3d/k8s-flow-3d.html">
      <span class="card-tag">Interactive deck</span>
      <h2>K8s Flow 3D</h2>
      <p>Mô phỏng 3D các luồng ra quyết định của Kubernetes: scheduler, eviction, OOM killer.</p>
    </a>
  </nav>
</body>
</html>
